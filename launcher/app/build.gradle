plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Android 6 (API 23) adaptation: renamed to com.gathin.tvhome6 so Xiaomi TvMgr's per-package
        // "third-party launcher" blocklist (it kills com.gathin.tvhome after the first attempt) does not match.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome6')
        // Android 6 (API 23) adaptation: original minSdk 26 required Android 8.0+, which MiTV 4C (Android 6.0.1)
        // cannot run. All API-26+ calls in the code are guarded by Build.VERSION.SDK_INT checks, so 23 is safe.
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '3.0'
    }

    buildTypes {
        release {
            // Android 6 (API 23) adaptation: R8 minification is DISABLED. With minifyEnabled true, R8 drops the
            // D8-desugared lambda classes (e.g. RemoteKeys$$ExternalSyntheticLambda1) and the app crashes at
            // startup with NoClassDefFoundError on Android 6.0.1. Slightly larger APK, still only ~1.5 MB.
            minifyEnabled false
            shrinkResources false
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        // Android 6 (API 23) adaptation: coreLibraryDesugaring bundles java.util.function and other Java 8
        // APIs into the APK. Without it the app crashes on Android 6.0.1 with NoClassDefFoundError on
        // RemoteKeys$$ExternalSyntheticLambda1 (java.util.function only exists from API 26).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
